# This example is based on cefsimple:
# https://github.com/tauri-apps/cef-rs/tree/dev/examples/cefsimple
# To run without sandbox, use: `cargo run -p counter --bin counter_app`.
# To run with sandbox, use: `cargo build -p counter --features=sandbox`, then run `.\bootstrap --module=counter` from the build output directory.
[package]
name = "counter"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "counter_app"
path = "src/main.rs"

[[bin]]
name = "counter_helper"

[features]
sandbox = ["cef/sandbox"]
linux-x11 = ["x11-dl"]

[package.metadata.bootstrap]
version = "5.3.8"

[dependencies]
anyhow = "1.0.104"
cef = { workspace = true, features = ["build-util"] }
cef-dll-sys.workspace = true
cef-resource-handlers = { path = "../.." }
maud = "0.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSEvent",
    "NSResponder",
    "NSUserInterfaceValidation",
    "NSView",
    "NSWindow",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = { version = "2.21.0", optional = true }

[build-dependencies]
anyhow = "1.0.104"
examples-common = { path = "../common" }
ureq = "3.4.2"
