# This example is based on cefsimple:
# https://github.com/tauri-apps/cef-rs/tree/dev/examples/cefsimple
# To run without sandbox, use: `cargo run -p counter --bin counter_app`.
# To run with sandbox, use: `cargo build -p counter --features=sandbox`, then run `.\bootstrap --module=counter` from the build output directory.
[package]
name = "counter"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "counter_app"
path = "src/main.rs"

[[bin]]
name = "counter_helper"

[features]
sandbox = ["cef/sandbox"]
linux-x11 = ["common/linux-x11"]

[package.metadata.bootstrap]
version = "5.3.8"

[dependencies]
anyhow = "1.0.104"
cef = { workspace = true, features = ["build-util"] }
cef-resource-handlers = { path = "../.." }
common = { package = "examples-common", path = "../common" }
maud = "0.27.0"

[build-dependencies]
anyhow = "1.0.104"
common-build = { package = "examples-common-build", path = "../common_build" }
