# The hello example is a separate workspace member and is not built by default.
[workspace]
members = [".", "examples/hello"]
default-members = ["."]

[workspace.dependencies]
cef = "150.2.1"
cef-dll-sys = "150.2.1"

[package]
# Package information
name = "cef-resource-handlers"
version = "0.1.0"
edition = "2024"

# Package metadata
description = "CEF resource handler factories for local files, dynamic web pages, and custom content providers."
authors = ["Noel Lopes <noel@ipg.pt>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/noellopes/cef-resource-handlers"

# Keywords and categories for crates.io
keywords = [
    "cef",
    "resource-handler",
    "scheme-handler",
    "custom-scheme",
    "content-provider",
]
categories = ["api-bindings", "web-programming", "gui"]

# Files to exclude from package
exclude = ["/.github", "/.vscode"]

[dependencies]
cef.workspace = true
cef-dll-sys.workspace = true
mime_guess = "2.0.5"
once_cell = "1.21.4"
serde_urlencoded = "0.7.1"
thiserror = "2.0.19"
